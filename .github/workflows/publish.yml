# 发布到 GitHub Packages（Maven 私有/公开仓库）
#
# 触发方式：
#   1) 推送 tag（推荐）：git tag v1.0.0 && git push origin v1.0.0
#   2) 手动：GitHub Actions 页面 Run workflow
#
# 前置要求：
#   - pom.xml 的 <distributionManagement> 已指向 GitHub Packages（见 pom.xml 注释）
#   - 仓库 Settings -> Actions -> General 勾选 "Allow GitHub Actions to create and approve releases" 非必需；
#     本工作流仅需 packages: write 权限（已在下方声明）
#   - GITHUB_TOKEN 由 GitHub 自动注入，无需手动配置 secret
#
# 注意：GitHub Packages 的同一版本不可重复发布，每次发版前需 bump pom.xml 的 <version>

name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'        # 匹配 v1.0.0 / v2.1.3 等
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 显式写入 Maven settings.xml：token 由 workflow 表达式直接展开写入，
      # 不依赖 setup-java 的 server 注入行为（避免该环节导致凭证缺失/字面量）
      - name: Write Maven settings
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GH_PAT }}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "settings.xml written"

      # 发布前打印实际解析到的 deploy URL，便于失败时快速定位
      - name: Show resolved deploy URL
        run: mvn -q -ntp help:evaluate -Dexpression=project.distributionManagement.repository.url -DforceStdout

      # 401 诊断（不打印任何密码）：验证 settings.xml 的 server 是否生成、GITHUB_TOKEN 是否有效
      - name: Diagnose auth (no secrets printed)
        run: |
          echo "--- GITHUB_TOKEN repo access (200=ok) ---"
          echo "Authorization: Bearer ${{ secrets.GH_PAT }}" "https://api.github.com/repos/${{ github.repository }}"

      # 发布前跑一遍项目自带回归（main 方法式检查，非 JUnit）
      # 注意：Linux 上 classpath 分隔符是冒号 :（Windows 才是分号 ;）
      - name: Regression checks
        run: |
          mvn -q -ntp compile test-compile
          CP="target/classes:target/test-classes"
          java -cp "$CP" com.cary.multiavatar.SvgOptimizeCheck
          java -cp "$CP" com.cary.multiavatar.OutputSmokeCheck
          java -cp "$CP" com.cary.multiavatar.JpgFormatCheck
          java -cp "$CP" com.cary.multiavatar.CacheCheck

      # 打 jar（含 sources.jar，maven-source-plugin 已配置）并上传到 GitHub Packages
      - name: Deploy to GitHub Packages
        run: mvn -B -ntp deploy

      # 发布成功提示：产物坐标 = com.cary:multiavatar-java:<version>
      - name: Show published coordinates
        run: |
          VERSION=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Published: com.cary:multiavatar-java:${VERSION}"
          echo "Repo: https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
