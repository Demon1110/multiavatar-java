# 每次 push / PR 自动回归：编译 + 打包 + 四项内置检查
#
# 目的：保证任何提交都不破坏 SVG 一致性、输出层正确性与缓存逻辑。

name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - name: Smoke checks
        run: |
          CP="target/classes:target/test-classes"
          java -cp "$CP" com.cary.multiavatar.SvgOptimizeCheck
          java -cp "$CP" com.cary.multiavatar.OutputSmokeCheck
          java -cp "$CP" com.cary.multiavatar.JpgFormatCheck
          java -cp "$CP" com.cary.multiavatar.CacheCheck
